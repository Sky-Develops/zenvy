name: ZENVY CI Pipeline

on:
  push:
    branches: [ "master", "main", "tegar-devops", "iqbal-auth", "rizky-frontend" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Unit & Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Mocha tests
        run: npm test

  build:
    name: Build & Package Artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build artifact
        run: |
          mkdir -p dist
          cp server.js package.json package-lock.json Dockerfile dist/
          if [ -f compose.yaml ]; then cp compose.yaml dist/; fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenvy-build-artifact
          path: dist/
